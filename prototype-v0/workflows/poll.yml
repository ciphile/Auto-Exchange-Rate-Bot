name: Answer commands

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub's minimum interval; runs are best-effort and can be delayed
  workflow_dispatch:

permissions:
  contents: write # state is kept on the `bot-state` branch (scripts/state.sh)

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: scripts/state.sh load
      - run: python -m bot poll
      - run: scripts/state.sh save
