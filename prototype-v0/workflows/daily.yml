name: Morning rate post

on:
  schedule:
    - cron: "10 2 * * *" # 02:10 UTC = 09:10 Vietnam (Abe usually posts around 9:15). GitHub may delay cron.
  workflow_dispatch:

permissions:
  contents: write # state is kept on the `bot-state` branch (scripts/state.sh)

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: scripts/state.sh load
      - run: python -m bot daily
      - run: scripts/state.sh save
